<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 14 112 112">
  <!-- Favicon cut of the Glacier igloo: one brick row line, thick joints and a small door that sits
       below it, so it still reads at 16-32px. The light end of the gradient is a step darker than
       the full mark's, so the left edge doesn't vanish on a white browser tab. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9DEF3"/>
      <stop offset="0.5" stop-color="#7FAEE0"/>
      <stop offset="1" stop-color="#1F6BC0"/>
    </linearGradient>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="130">
      <rect x="0" y="0" width="120" height="130" fill="#fff"/>
      <path d="M0 60H120M28 60V96M92 60V96M42 40V60M78 40V60" stroke="#000" stroke-width="7" fill="none"/>
      <path d="M45 96V88A15 15 0 0 1 75 88V96" stroke="#000" stroke-width="7" fill="none"/>
    </mask>
  </defs>
  <path d="M6 96A54 54 0 0 1 114 96Z" fill="url(#g)" mask="url(#cut)"/>
</svg>

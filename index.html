<!doctype html>
<html lang="en" data-theme="glacier-forest" data-motion="always">
  <head>
    <meta charset="UTF-8" />
    <!-- the simplified igloo from branding/, which stays readable at tab size -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>SomedayTundra</title>
    <script>
      // apply the saved theme before first paint so a reload doesn't flash the wrong one
      try {
        var t = JSON.parse(localStorage.getItem('st.theme') || 'null')
        if (t === 'glacier-forest' || t === 'aurora') document.documentElement.dataset.theme = t
        var m = JSON.parse(localStorage.getItem('st.motion') || 'null')
        if (m === 'always' || m === 'system' || m === 'off') document.documentElement.dataset.motion = m
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
